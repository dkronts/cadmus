name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install spylls pytest
      - run: pip install -e . --no-deps
      - run: pytest tests/test_rules_unit.py tests/test_corruptions.py tests/test_lexicon.py tests/test_export.py tests/test_stream.py tests/test_diagnostics.py tests/test_morphology_unit.py tests/test_batch.py tests/test_normalize.py -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache stanza Greek models (~/.cache/stanza)
        uses: actions/cache@v4
        with:
          path: ~/.cache/stanza
          key: stanza-el-1.15
      - name: Cache cadmus data assets (~/.cache/cadmus)
        uses: actions/cache@v4
        with:
          path: ~/.cache/cadmus
          key: cadmus-assets-v1
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=cadmus --cov-report=term
